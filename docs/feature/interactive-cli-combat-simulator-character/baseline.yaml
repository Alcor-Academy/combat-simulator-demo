requirements_source:
  origin: "Software Crafters Live Coding Demo"

  business_case: |
    **Educational Demonstration, Not Production Software**

    This is NOT a production system - it's a **60-minute live coding demonstration**
    for Software Crafters conference attendees. The business value is EDUCATIONAL,
    not functional.

    **Primary Stakeholders**:
    1. Alex (Demo Presenter) - Needs compelling demonstration of AI + TDD
    2. Software Crafters Audience - Wants to learn Claude Code + disciplined practices
    3. Claude Code (AI Developer) - Executes TDD Outside-In methodology

    **Value Proposition**:
    "Prove that AI coding assistants, when guided by disciplined practices (ATDD,
    TDD Outside-In, Clean Architecture), produce maintainable, tested,
    architecturally sound code."

    **Success Metrics** (from requirements.md):
    - Functional: Playable combat simulator with 100% test coverage
    - Demonstration: Completed in 60 minutes with minimum 4 "wow moments"
    - Educational: Audience understands METHODOLOGY, not just AI tool

    **NOT Success Metrics**:
    - Production readiness (no need for persistence, security, scalability)
    - Real-world usage (no actual gameplay beyond demo)
    - Feature completeness (simplified D&D rules only)

  validation_evidence:
    - source: "docs/requirements/requirements.md"
      validation_method: "Stakeholder analysis, success criteria definition"
      confidence: HIGH
      evidence: |
        Requirements document includes:
        - Executive summary with business context
        - Explicit stakeholder analysis (Alex, Audience, Claude Code)
        - Definition of Done for demo success
        - 8 documented "wow moments" with triggers and expected outcomes

    - source: "docs/requirements/user-stories.md"
      validation_method: "ATDD-compliant Given-When-Then format"
      confidence: HIGH
      evidence: |
        7 user stories covering complete Epic:
        - US-01: Character Creation (Foundation)
        - US-02: Dice Rolling (Architecture)
        - US-03: Initiative (Combat Order)
        - US-04: Attack Resolution (Core Mechanic)
        - US-05: Combat Round (Attacker Advantage)
        - US-06: Game Loop (Automation)
        - US-07: Victory Condition (Required)

        Each story includes business value, acceptance criteria, demo script notes.

    - source: "docs/requirements/acceptance-criteria.md"
      validation_method: "Executable Gherkin scenarios"
      confidence: HIGH
      evidence: |
        26 acceptance criteria in Given-When-Then format:
        - 18 Critical priority (must pass for demo success)
        - 8 High priority (should pass for quality)
        - All criteria testable and observable through public API

    - source: "docs/distill/acceptance-tests-design.md"
      validation_method: "E2E test scenarios with production service integration"
      confidence: HIGH
      evidence: |
        9 scenarios covering:
        - 6 success paths (full combat, initiative, attacker advantage, etc.)
        - 3 error paths (empty name, dead attacker, tie-breaker)
        - 100% user story coverage (7/7)
        - 100% domain rule coverage (10/10)

  requirement_specifics:
    feature_name: "Interactive CLI Combat Simulator with Character Creation"

    user_stories:
      - id: "US-01"
        story: "Character Creation with Derived Agility"
        priority: CRITICAL
        acceptance_criteria:
          - "AC-1.2: Character creation with fixed stats"
          - "AC-1.3: Character liveness check - alive"
          - "AC-1.4: Character liveness check - dead"
          - "AC-1.5: Character name validation"
          - "AC-1.6: Immutability on damage"

      - id: "US-02"
        story: "Dice Rolling System with Port/Adapter Pattern"
        priority: CRITICAL
        acceptance_criteria:
          - "AC-2.1: Random dice roll range [1,6]"
          - "AC-2.2: Deterministic test double - fixed value"
          - "AC-2.3: Deterministic test double - sequence"
          - "AC-2.4: Port/Adapter interchangeability"

      - id: "US-03"
        story: "Initiative Roll Determines Combat Order"
        priority: CRITICAL
        acceptance_criteria:
          - "AC-3.1: Initiative calculation (Agility + D6)"
          - "AC-3.2: Initiative tie-breaker"

      - id: "US-04"
        story: "Attack Resolution with Damage Calculation"
        priority: CRITICAL
        acceptance_criteria:
          - "AC-4.1: Damage calculation formula (Attack + D6)"
          - "AC-4.2: Damage application - normal case"
          - "AC-4.3: Damage application - HP floor at 0"
          - "AC-4.4: Attack result structure"
          - "AC-4.5: Dead character cannot attack"

      - id: "US-05"
        story: "Combat Round with Attacker Advantage Rule"
        priority: CRITICAL
        acceptance_criteria:
          - "AC-5.1: Both characters attack (defender survives)"
          - "AC-5.2: Attacker kills defender - no counter-attack"
          - "AC-5.3: Round result data structure"
          - "AC-5.4: No console prints in domain logic"

      - id: "US-06"
        story: "Game Loop Automation"
        priority: CRITICAL
        acceptance_criteria:
          - "AC-6.1: Fully automated combat to victory"
          - "AC-6.2: Combat output shows progression"
          - "AC-6.3: Combat ends immediately on death"

      - id: "US-07"
        story: "Victory Condition Detection"
        priority: CRITICAL
        acceptance_criteria:
          - "AC-7.1: Victory when opponent dies"
          - "AC-7.2: Victory message format"

    domain_rules:
      - id: "DR-01"
        rule: "Characters are immutable value objects"
        enforcement: "@dataclass(frozen=True), no setters, receive_damage returns new instance"

      - id: "DR-02"
        rule: "Damage = Attack Power + Dice Roll (1d6)"
        enforcement: "AttackResolver.resolve_attack() implementation"

      - id: "DR-03"
        rule: "HP cannot go below 0 (floor at 0)"
        enforcement: "Character.receive_damage() uses max(0, hp - damage)"

      - id: "DR-04"
        rule: "Initiative rolled ONCE at fight start"
        enforcement: "CombatSimulator calls InitiativeResolver once before round loop"

      - id: "DR-05"
        rule: "Initiative = Agility + D6"
        enforcement: "InitiativeResolver calculation"

      - id: "DR-06"
        rule: "Attacker advantage - defender counter-attacks ONLY if alive"
        enforcement: "CombatRound.execute_round() checks defender.is_alive before counter-attack"

      - id: "DR-07"
        rule: "Combat ends when one character reaches 0 HP"
        enforcement: "CombatSimulator checks is_alive after each round"

      - id: "DR-08"
        rule: "Agility = Attack Power + Current HP (derived, not stored)"
        enforcement: "Character.agility as @property computed from hp + attack_power"

      - id: "DR-09"
        rule: "All dice rolls return [1,6] inclusive"
        enforcement: "RandomDiceRoller uses random.randint(1, 6)"

      - id: "DR-10"
        rule: "Randomness is injectable for testability"
        enforcement: "DiceRoller Protocol, constructor injection, FixedDiceRoller test double"

  stakeholder_feedback: |
    **No User Feedback - Educational Demo**

    This is NOT a user-facing product with customer feedback. It's a conference demo.
    Requirements validation comes from:

    1. **Demo Rehearsal Planning** (not yet conducted)
       - Will validate 60-minute timeline
       - Will test "wow moments" effectiveness
       - Will refine presenter script

    2. **Software Craftsmanship Best Practices**
       - Requirements follow ATDD principles
       - User stories in Given-When-Then format
       - Clear acceptance criteria
       - Testability-first design

    3. **Implicit Validation Through Documentation Review**
       - Architecture review APPROVED (docs/architecture/architecture-design.md includes review)
       - Acceptance test design APPROVED (docs/distill/handoff-to-develop.md shows self-review)
       - Requirements specification complete with stakeholder analysis

    **Stakeholder Sign-Off Status**:
    - ✅ Alex (Presenter): Implicit approval via project initiation
    - ⏳ Software Crafters Audience: Validation pending demo execution
    - ✅ Claude Code: Requirements structured for TDD Outside-In execution

# ============================================================================
# SIMPLER ALTERNATIVES ANALYSIS (CRITICAL FOR FEATURES)
# ============================================================================

simpler_alternatives:
  considered: true

  alternatives:
    - alternative: "Single monolithic class for all combat logic"
      description: |
        Implement entire combat system in one CombatGame class with all methods:
        - create_character()
        - roll_dice()
        - calculate_initiative()
        - resolve_attack()
        - run_combat()

      pros:
        - Fastest implementation (~15 minutes)
        - Minimal file structure
        - No dependency injection needed

      cons:
        - Loses Hexagonal Architecture demonstration (key demo objective)
        - Cannot show Port/Adapter pattern emergence
        - Mixed concerns (domain + infrastructure + presentation)
        - Lower educational value

      rejection_reason: |
        **REJECTED**: Demo's PURPOSE is to show Clean Architecture with TDD.
        A monolithic approach defeats the educational objective. The 60-minute
        constraint includes TEACHING time, not just coding time. Architecture
        patterns must be visible.

      cost_benefit: "Saves 10-15 minutes coding, loses 100% of architectural teaching value"

    - alternative: "Skip E2E tests, use only unit tests"
      description: |
        Eliminate pytest-bdd E2E scenarios, rely solely on pytest unit tests:
        - Unit tests for Character, DiceRoller, etc.
        - No walking skeleton acceptance test
        - No Given-When-Then business language

      pros:
        - Faster test execution
        - Simpler test infrastructure (no pytest-bdd)
        - Less test code to write

      cons:
        - Loses Outside-In TDD demonstration
        - No business-readable acceptance criteria execution
        - Cannot show how tests drive architecture
        - Missing ATDD teaching moment

      rejection_reason: |
        **REJECTED**: Outside-In TDD with failing E2E test is a core "wow moment".
        Audience needs to see:
        1. E2E test written FIRST (fails with import errors)
        2. Implementation driven by test failures
        3. E2E test turns green when sufficient components exist

        This is WHY the project uses pytest-bdd - to make ATDD visible.

      cost_benefit: "Saves 5-10 minutes, loses ATDD demonstration (primary value)"

    - alternative: "Use existing combat library (e.g., py-d20)"
      description: |
        Leverage existing Python dice/combat libraries:
        - py-d20 for dice rolling
        - Generic RPG combat frameworks
        - Pre-built character systems

      pros:
        - Much faster implementation (5-10 minutes)
        - Battle-tested code
        - Potentially richer features

      cons:
        - Defeats purpose of LIVE CODING demo
        - No TDD demonstration (code already exists)
        - Audience sees library integration, not software craftsmanship
        - Cannot show immutability patterns, port/adapter, etc.

      rejection_reason: |
        **REJECTED**: This is a LIVE CODING demonstration of TDD + AI.
        Using pre-existing libraries skips the demonstration entirely.
        The CODE is the ARTIFACT being demonstrated, not the functionality.

      cost_benefit: "Saves 40-50 minutes, loses 100% of demo value"

    - alternative: "Mutable Character class (traditional OOP)"
      description: |
        Use standard Python class with setters instead of immutable dataclass:
        ```python
        class Character:
            def __init__(self, name, hp, attack_power):
                self.name = name
                self.hp = hp
                self.attack_power = attack_power

            def take_damage(self, amount):
                self.hp = max(0, self.hp - amount)  # Mutates self
        ```

      pros:
        - More familiar to OOP developers
        - Simpler mental model (mutate in place)
        - Less object creation overhead

      cons:
        - Loses immutability "wow moment"
        - Cannot demonstrate frozen dataclasses
        - State mutation bugs become possible
        - Harder to test (shared state issues)

      rejection_reason: |
        **REJECTED**: Immutability is a KEY TEACHING POINT (wow moment #4).
        Demo shows how @dataclass(frozen=True) prevents bugs by making illegal
        states unrepresentable. Character.receive_damage() returning NEW instance
        demonstrates functional programming principles in Python.

      cost_benefit: "Saves 2-3 minutes, loses immutability teaching moment"

    - alternative: "Skip CLI layer, use Python REPL"
      description: |
        Run combat simulation directly from Python REPL:
        ```python
        >>> char1 = Character("Thorin", 20, 5)
        >>> char2 = Character("Goblin", 10, 3)
        >>> simulator.run_combat(char1, char2)
        ```

      pros:
        - No CLI framework needed (no Click, no Rich)
        - Faster implementation (skip entire DELIVER wave)
        - Simpler dependency list

      cons:
        - Less visually impressive for audience
        - Cannot show Rich formatting (panels, colors, tables)
        - Harder to demonstrate to non-technical audience
        - Loses professional polish

      rejection_reason: |
        **ACCEPTED FOR DEVELOP WAVE**: CLI is intentionally deferred to DELIVER wave.
        Core TDD implementation (DEVELOP wave) focuses on domain logic.
        CLI layer is presentation concern, added AFTER business logic works.

        This aligns with Outside-In TDD: Get E2E tests passing with domain code,
        THEN add CLI for human interaction.

      cost_benefit: "Saves 5-10 minutes in DELIVER wave, acceptable trade-off"

  chosen_approach: |
    **Hexagonal Architecture with TDD Outside-In (As Documented)**

    The documented approach is CORRECT for the demo objectives:

    **Why This Approach Delivers 80% of Value**:

    1. **Educational Value** (Primary Goal): 90%
       - Shows TDD red-green-refactor cycles
       - Demonstrates Hexagonal Architecture emergence
       - Proves immutability patterns work
       - Validates Port/Adapter for testability

    2. **Demonstration Quality** (Secondary Goal): 85%
       - 8 "wow moments" enabled by architecture
       - Visible methodology (not just AI magic)
       - Professional code quality (100% coverage)
       - Compelling narrative (failing test → passing test)

    3. **60-Minute Constraint** (Constraint): 80%
       - Architecture minimizes unnecessary complexity
       - No speculative features
       - Test-first prevents rework
       - Clear implementation order documented

    **Simpler Alternatives Miss the Point**:
    - Monolithic code: Saves time, loses teaching value (BAD TRADE)
    - Skipping E2E: Saves time, loses ATDD demo (BAD TRADE)
    - Using library: Saves time, loses live coding (DEFEATS PURPOSE)
    - Mutable objects: Saves time, loses wow moment (BAD TRADE)
    - REPL only: Saves time, acceptable for DEVELOP wave (GOOD TRADE)

    **The 80/20 Rule Applied**:
    - 20% of features (core combat) deliver 80% of demo value
    - Complex D&D rules (spells, armor, skills) intentionally omitted
    - CLI deferred to DELIVER wave (can be skipped if time runs out)
    - Architecture focused where it teaches, simple where it doesn't

  data_supporting_choice: |
    **Evidence from Documentation Review**:

    1. **Architecture Design Document** (docs/architecture/architecture-design.md):
       - Independent peer review by solution-architect-reviewer
       - Review verdict: "APPROVED - High quality, fit-for-purpose"
       - Simplicity rating: 9/10
       - Effectiveness rating: 10/10
       - Priority validation: PASS

    2. **Requirements Specification** (docs/requirements/requirements.md):
       - Timeline breakdown: 8 phases in 60 minutes
       - Feature sizing: 5-15 minutes per feature
       - Wow moments mapped to features (8 moments across 7 features)
       - Risk assessment: Time overrun = MEDIUM (Features 6+7 can compress)

    3. **Acceptance Test Design** (docs/distill/acceptance-tests-design.md):
       - Test count: 9 E2E scenarios, 20-25 unit tests (total ~30 tests)
       - Test pyramid: 1-2 E2E, 0 integration, 20-25 unit (appropriate ratio)
       - Implementation order documented (Character → DiceRoller → ... → CombatSimulator)

    4. **Test Execution Time** (from acceptance tests):
       - Expected E2E execution: <5 seconds for all 9 scenarios
       - Fast feedback loop enables rapid TDD iteration
       - No slow integration tests or external dependencies

    **Quantitative Justification**:
    - Test coverage target: 100% domain logic (achievable with 20-25 unit tests)
    - Component count: 11 classes (5 value objects, 3 services, 1 use case, 2 adapters)
    - Cyclomatic complexity target: <10 per function (maintainable)
    - Lines of code estimate: ~400-500 LOC production, ~600-800 LOC tests

    **This is NOT Over-Engineered**:
    - No repository pattern (unnecessary for in-memory domain)
    - No event sourcing (no historical requirements)
    - No async/await (turn-based, synchronous)
    - No logging framework (Rich console sufficient)
    - No database (transient combat sessions)
    - No API layer (CLI only)

    The architecture adds complexity ONLY where it teaches valuable patterns.

