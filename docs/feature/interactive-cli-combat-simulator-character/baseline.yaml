validation_criteria:
  success_definition: |
    **Demo is Successful When ALL Quality Gates Pass**:

    1. **Functional Completeness**:
       - All 9 E2E acceptance tests PASS
       - All 20-25 unit tests PASS
       - No skipped tests
       - No failing tests
       - Combat simulator produces correct winner

    2. **Demonstration Completeness**:
       - Implementation completes within 60 minutes
       - Minimum 4 "wow moments" demonstrated
       - Audience understands TDD methodology (qualitative)
       - Code quality shows professional craftsmanship

    3. **Test Coverage**:
       - 100% line coverage for domain logic
       - 100% branch coverage for domain logic
       - Coverage report generated and displayed

    4. **Architecture Compliance**:
       - Hexagonal Architecture visible in folder structure
       - All value objects use @dataclass(frozen=True)
       - Character.agility is computed property (not stored)
       - DiceRoller is Protocol class
       - Dependencies flow inward (CLI → App → Domain)
       - No console prints in domain layer

    5. **Code Quality**:
       - Cyclomatic complexity <10 per function
       - No code duplication >5%
       - Descriptive names (no abbreviations)
       - Max line length 88 characters (black formatter)

    6. **Business Rule Enforcement**:
       - All 10 domain rules (DR-01 through DR-10) enforced by code
       - Immutability validated by tests
       - Attacker advantage rule working correctly
       - Derived agility reflects HP changes

    **Definition of DONE** (from handoff document):
    - All acceptance criteria validated through passing tests
    - Code is maintainable, readable, follows Python best practices
    - Ready for CLI layer implementation (DELIVER wave)

  acceptance_gates:
    - gate: "Phase 1 Complete - Domain Model Foundation"
      criteria:
        - "Character class implemented with frozen dataclass"
        - "Character.agility property returns hp + attack_power"
        - "Character.is_alive property correct"
        - "Character.receive_damage() returns new instance"
        - "Validation in __post_init__ (name, hp, attack)"
        - "DiceRoller Protocol defined"
        - "RandomDiceRoller implements roll() → int [1,6]"
      tests_passing:
        - "Scenario 5: Character immutability during combat"
        - "Scenario 6: Derived agility reflects current health"
        - "Scenario 7: Character creation fails with empty name"
      blocking: true

    - gate: "Phase 2 Complete - Combat Services"
      criteria:
        - "InitiativeResolver.roll_initiative() implemented"
        - "Initiative = agility + dice roll"
        - "Tie-breaker: higher agility, then first character"
        - "AttackResolver.resolve_attack() implemented"
        - "Damage = attack_power + dice roll"
        - "Dead character validation (raises ValueError)"
        - "CombatRound.execute_round() implemented"
        - "Attacker advantage enforced (check is_alive before counter)"
      tests_passing:
        - "Scenario 2: Character with higher agility wins initiative"
        - "Scenario 8: Dead character cannot initiate attack"
        - "Scenario 9: Initiative tie resolved by first character rule"
        - "Scenario 3: Attacker kills defender - no counter-attack"
        - "Scenario 4: Defender survives and counter-attacks"
      blocking: true

    - gate: "Phase 3 Complete - Application Layer"
      criteria:
        - "CombatSimulator.run_combat() implemented"
        - "Initiative rolled once at start"
