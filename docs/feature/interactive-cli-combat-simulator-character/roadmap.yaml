# ============================================================================
# PHASE 1: DOMAIN MODEL FOUNDATION (~25 minutes - REVISED from 15 minutes)
# ============================================================================

phases:
  - phase_number: 1
    phase_name: "Domain Model Foundation"
    purpose: "Establish hexagonal folder structure, immutable value objects, and randomness port for testability"
    estimated_duration: "25 minutes"

    success_criteria:
      - "Hexagonal folder structure created"
      - "Character class implemented as frozen dataclass"
      - "Character.agility property returns hp + attack_power"
      - "Character.is_alive property correct"
      - "Character.receive_damage() returns new instance"
      - "DiceRoller Protocol defined"
      - "RandomDiceRoller adapter implemented"
      - "Scenarios 5, 6, 7 PASS (immutability, agility, validation)"

    steps:
      # ------------------------------------------------------------------
      # STEP 01-00: Setup Hexagonal Architecture Folder Structure
      # ------------------------------------------------------------------
      - step_id: "01-00"
        step_name: "Setup Hexagonal Architecture Folder Structure"
        description: |
          Create complete folder structure for Hexagonal Architecture.
          This ensures all subsequent steps place files in correct locations.

        motivation: |
          Establishing folder structure first:
          1. Makes Hexagonal Architecture immediately visible
          2. Prevents file placement errors in later steps
          3. Satisfies success criteria "Hexagonal Architecture visible in folder structure"
          4. Provides clear organization for domain, application, and infrastructure layers

        estimated_hours: 0.03  # ~2 minutes

        dependencies: []

        prerequisites: []

        implementation_guidance:
          commands: |
            mkdir -p src/domain/model/
            mkdir -p src/domain/services/
            mkdir -p src/domain/ports/
            mkdir -p src/infrastructure/
            mkdir -p src/application/
            mkdir -p tests/unit/domain/model/
            mkdir -p tests/unit/domain/services/
            mkdir -p tests/unit/infrastructure/
            mkdir -p tests/unit/application/
            mkdir -p tests/doubles/
            mkdir -p tests/e2e/

          verification: |
            tree -L 3 src/
            tree -L 2 tests/

          expected_structure: |
            src/
            ├── domain/
            │   ├── model/
            │   ├── services/
            │   └── ports/
            ├── infrastructure/
            └── application/

            tests/
            ├── unit/
            │   ├── domain/
            │   ├── infrastructure/
            │   └── application/
            ├── doubles/
            └── e2e/

        acceptance_criteria:
          - criterion: "All domain layer folders exist"
            verification: "ls -d src/domain/{model,services,ports}"

          - criterion: "Infrastructure and application folders exist"
            verification: "ls -d src/{infrastructure,application}"

          - criterion: "All test layer folders exist"
            verification: "ls -d tests/{unit,doubles,e2e}"

          - criterion: "Unit test structure mirrors src structure"
            verification: "ls -d tests/unit/{domain,infrastructure,application}"

        validation_commands:
          - "find src -type d | sort"
          - "find tests -type d | sort"

        deliverables:
          - description: "Complete hexagonal architecture folder structure"
            verification: "Folder tree matches expected structure"

      # ------------------------------------------------------------------
      # STEP 01-01: Implement Character Value Object
      # ------------------------------------------------------------------
      - step_id: "01-01"
        step_name: "Implement Character Value Object"
        description: |
          Create the Character class as an immutable value object using frozen dataclass.
          This is the foundation of the domain model and enables derived agility "wow moment".

        motivation: |
          Character is the core domain entity. Implementing it first allows:
          1. Immediate validation of immutability pattern (@dataclass(frozen=True))
          2. Demonstration of derived properties (agility = hp + attack_power)
          3. Proof that state changes return new instances (functional approach)
          4. Foundation for all combat mechanics

        estimated_hours: 0.33  # ~20 minutes (REVISED from 15 minutes)

        dependencies:
          - step_id: "01-00"
            reason: "Requires folder structure for file placement"

        prerequisites:
          - "Read docs/architecture/architecture-design.md (Appendix A: Character interface)"
          - "Read docs/distill/handoff-to-develop.md (Phase 1: Character implementation)"
          - "Review tests/e2e/test_combat_simulation.py (scenarios using Character)"

        inputs:
          - file: "docs/architecture/architecture-design.md"
            relevant_sections: ["Domain Model Detail > Value Objects > Character", "Pattern 1: Immutable Value Objects"]
          - file: "docs/requirements/user-stories.md"
            relevant_sections: ["Story 1: Character Creation (AC-1.2 through AC-1.6)"]

        implementation_guidance:
          location: "src/domain/model/character.py"

          pattern: |
            @dataclass(frozen=True)
            class Character:
                name: str
                hp: int
                attack_power: int

                def __post_init__(self) -> None:
                    # Validate name non-empty
                    # Validate hp >= 0
                    # Validate attack_power > 0

                @property
                def agility(self) -> int:
                    # DERIVED: hp + attack_power (never stored)
                    return self.hp + self.attack_power

                @property
                def is_alive(self) -> bool:
                    return self.hp > 0

                def receive_damage(self, amount: int) -> "Character":
                    # Return NEW instance with reduced HP (floored at 0)
                    new_hp = max(0, self.hp - amount)
                    return Character(name=self.name, hp=new_hp, attack_power=self.attack_power)

          validation_rules:
            - "Name cannot be empty string (raise ValueError)"
            - "HP cannot be negative (raise ValueError)"
            - "Attack power must be positive (raise ValueError)"

          test_approach: |
            Create tests/unit/domain/model/test_character.py using pytest-describe:
            - describe_creation(): Test valid creation, validation errors
            - describe_agility(): Test derived property updates with HP changes
            - describe_is_alive(): Test alive (HP > 0) and dead (HP = 0) states
            - describe_receive_damage(): Test immutability, HP flooring, new instance

          expected_test_count: "5-6 unit tests"

        acceptance_criteria:
          - criterion: "Character class exists in src/domain/model/character.py"
            verification: "File exists and imports successfully"

          - criterion: "Character uses @dataclass(frozen=True)"
            verification: "Attempting to mutate raises FrozenInstanceError"

          - criterion: "agility property returns hp + attack_power"
            verification: "Character(hp=20, attack=5).agility == 25"

          - criterion: "is_alive returns True for HP > 0, False for HP = 0"
            verification: "Unit test validates both states"

          - criterion: "receive_damage(amount) returns new Character instance"
            verification: "Original unchanged, new instance has reduced HP"

          - criterion: "receive_damage floors HP at 0 (never negative)"
            verification: "Character(hp=5).receive_damage(10).hp == 0"

          - criterion: "Validation rejects empty name, negative HP, non-positive attack"
            verification: "ValueError raised in __post_init__ for invalid inputs"

        validation_commands:
          - "pytest tests/unit/domain/model/test_character.py -v"
          - "pytest tests/e2e/test_combat_simulation.py::test_character_immutability_during_combat -v"
          - "pytest tests/e2e/test_combat_simulation.py::test_derived_agility_reflects_current_health -v"
          - "pytest tests/e2e/test_combat_simulation.py::test_character_creation_fails_with_empty_name -v"

        expected_e2e_scenarios_passing:
          - "Scenario 5: Character immutability during combat"
          - "Scenario 6: Derived agility reflects current health"
          - "Scenario 7: Character creation fails with empty name"

        deliverables:
          - file: "src/domain/model/character.py"
            description: "Character frozen dataclass with agility property"
          - file: "tests/unit/domain/model/test_character.py"
            description: "Unit tests for Character (5-6 tests)"

        wow_moment:
          trigger: "Character.agility property implementation"
          demonstration: "Show that agility CHANGES as HP decreases (derived, not stored)"
          audience_value: "Proves immutability + derived properties prevent inconsistent state"

      # ------------------------------------------------------------------
      # STEP 01-02: Implement DiceRoller Port and Adapters
      # ------------------------------------------------------------------
      - step_id: "01-02"
        step_name: "Implement DiceRoller Port and RandomDiceRoller Adapter"
        description: |
          Define the DiceRoller Protocol (port interface) and implement RandomDiceRoller
          production adapter. This establishes Hexagonal Architecture foundation.

        motivation: |
          DiceRoller port enables:
          1. Dependency injection for testability
          2. Hexagonal Architecture demonstration (port/adapter pattern)
          3. Randomness abstraction for deterministic tests
          4. Foundation for all combat services requiring dice rolls

        estimated_hours: 0.17  # 10 minutes

        dependencies:
          - step_id: "01-00"
            reason: "Requires folder structure for file placement"
          - step_id: "01-01"
            reason: "Character needs dice roller for future stat generation"

        prerequisites:
          - "Read docs/architecture/architecture-design.md (Pattern 2: Ports with Protocol Classes)"
          - "Review tests/doubles/fixed_dice_roller.py (test double implementation reference)"

        inputs:
          - file: "docs/architecture/architecture-design.md"
            relevant_sections: ["Pattern 2: Ports with Protocol Classes", "Appendix A: DiceRoller interface"]
          - file: "docs/requirements/user-stories.md"
            relevant_sections: ["Story 2: Dice Rolling System (AC-2.1, AC-2.4)"]

        implementation_guidance:
          dice_roller_port:
            location: "src/domain/ports/dice_roller.py"
            pattern: |
              from typing import Protocol

              class DiceRoller(Protocol):
                  """Port interface for dice rolling abstraction.

                  Implementations:
                  - RandomDiceRoller: Production adapter using random.randint
                  - FixedDiceRoller: Test double returning predetermined values

                  FixedDiceRoller Interface (Test Double):
                    Sequence Mode:
                      roller = FixedDiceRoller([3, 5, 2, 6, 1])  # Returns values in sequence
                      assert roller.roll() == 3  # First call
                      assert roller.roll() == 5  # Second call
                      assert roller.roll() == 2  # Third call

                    Fixed Value Mode:
                      roller = FixedDiceRoller(fixed_value=4)  # Always returns same value
                      assert roller.roll() == 4
                      assert roller.roll() == 4

                  Note: FixedDiceRoller exists in tests/doubles/ (created during DISTILL wave).
                  Verify interface matches test usage before implementing services.
                  """

                  def roll(self) -> int:
                      """Roll a D6 die.

                      Returns:
                          Integer in range [1, 6] inclusive.
                      """
                      ...

          random_dice_roller:
            location: "src/infrastructure/random_dice_roller.py"
            pattern: |
              import random

              class RandomDiceRoller:
                  """Production adapter for DiceRoller using random.randint."""

                  def roll(self) -> int:
                      """Roll D6 (1-6 inclusive)."""
                      return random.randint(1, 6)

          test_approach: |
            Create tests/unit/infrastructure/test_random_dice_roller.py:
            - Test roll() returns value in [1, 6] range
            - Run 100 rolls, verify all values in range (statistical validation)
            - Test FixedDiceRoller already exists in tests/doubles/

        acceptance_criteria:
          - criterion: "DiceRoller Protocol defined with roll() → int signature"
            verification: "Protocol exists in src/domain/ports/dice_roller.py"

          - criterion: "DiceRoller Protocol documentation includes FixedDiceRoller interface modes"
            verification: "Docstring documents both sequence mode and fixed value mode"

          - criterion: "RandomDiceRoller implements roll() returning [1, 6]"
            verification: "100 rolls all in range [1, 6]"

          - criterion: "RandomDiceRoller satisfies DiceRoller Protocol (structural typing)"
            verification: "mypy type checking passes"

          - criterion: "FixedDiceRoller already exists in tests/doubles/"
            verification: "tests/doubles/fixed_dice_roller.py imports successfully"

        validation_commands:
          - "pytest tests/unit/infrastructure/test_random_dice_roller.py -v"
          - "python -c 'from src.infrastructure.random_dice_roller import RandomDiceRoller; r = RandomDiceRoller(); assert 1 <= r.roll() <= 6'"

        deliverables:
          - file: "src/domain/ports/dice_roller.py"
            description: "DiceRoller Protocol interface with FixedDiceRoller documentation"
          - file: "src/infrastructure/random_dice_roller.py"
            description: "RandomDiceRoller production adapter"
          - file: "tests/unit/infrastructure/test_random_dice_roller.py"
            description: "Unit tests for RandomDiceRoller (2-3 tests)"

        wow_moment:
          trigger: "Port/Adapter pattern implementation"
          demonstration: "Show how FixedDiceRoller and RandomDiceRoller both satisfy DiceRoller Protocol without inheritance"
          audience_value: "Hexagonal Architecture emerges from testability constraint, not upfront design"

# ============================================================================
# PHASE 2: DOMAIN SERVICES (~25 minutes)
# ============================================================================

  - phase_number: 2
    phase_name: "Domain Services - Combat Mechanics"
    purpose: "Implement combat resolution services with attacker advantage rule enforcement"
    estimated_duration: "25 minutes"

    success_criteria:
      - "InitiativeResolver calculates initiative and determines combat order"
      - "AttackResolver resolves attacks with damage calculation"
      - "CombatRound orchestrates single round with attacker advantage"
      - "Dead character validation prevents attacks with specific error message"
      - "Scenarios 2, 3, 4, 8, 9 PASS (initiative, attacks, advantage)"

    steps:
      # ------------------------------------------------------------------
      # STEP 02-01: Implement InitiativeResult and InitiativeResolver
      # ------------------------------------------------------------------
      - step_id: "02-01"
        step_name: "Implement InitiativeResult and InitiativeResolver"
        description: |
          Create InitiativeResult value object and InitiativeResolver domain service
          to determine combat order through initiative rolls at fight start.

        motivation: |
          Initiative determines who attacks first for entire combat. This:
          1. Sets up attacker advantage rule (attacker strikes first every round)
          2. Demonstrates domain service with dependency injection (DiceRoller)
          3. Implements tie-breaker logic (higher agility, then first character)

        estimated_hours: 0.17  # 10 minutes

        dependencies:
          - step_id: "01-01"
            reason: "Requires Character with agility property"
          - step_id: "01-02"
            reason: "Requires DiceRoller port for dice rolls"

        prerequisites:
          - "Read docs/requirements/user-stories.md (Story 3: Initiative Roll)"
          - "Read docs/architecture/architecture-design.md (InitiativeResolver interface)"

        inputs:
          - file: "docs/architecture/architecture-design.md"
            relevant_sections: ["Domain Services > InitiativeResolver", "Appendix A: InitiativeResult"]
          - file: "docs/requirements/user-stories.md"
            relevant_sections: ["Story 3: Initiative Roll (AC-3.1, AC-3.2)"]

        implementation_guidance:
          initiative_result:
            location: "src/domain/model/initiative_result.py"
            pattern: |
              @dataclass(frozen=True)
              class InitiativeResult:
                  attacker: Character      # Higher initiative, attacks first
                  defender: Character      # Lower initiative, counter-attacks
                  attacker_roll: int       # D6 roll for attacker
                  defender_roll: int       # D6 roll for defender
                  attacker_total: int      # attacker.agility + attacker_roll
                  defender_total: int      # defender.agility + defender_roll

          initiative_resolver:
            location: "src/domain/services/initiative_resolver.py"
            pattern: |
              @dataclass
              class InitiativeResolver:
                  dice_roller: DiceRoller  # Injected dependency

                  def roll_initiative(self, char1: Character, char2: Character) -> InitiativeResult:
                      """Roll initiative to determine combat order.

                      Initiative = agility + D6 roll
                      Tie-breaker: higher agility, then char1 wins
                      """
                      char1_roll = self.dice_roller.roll()
                      char2_roll = self.dice_roller.roll()

                      char1_total = char1.agility + char1_roll
                      char2_total = char2.agility + char2_roll

                      # Determine winner (tie-breaker: higher agility, then char1)
                      if char1_total > char2_total:
                          attacker, defender = char1, char2
                          attacker_roll, defender_roll = char1_roll, char2_roll
                      elif char2_total > char1_total:
                          attacker, defender = char2, char1
                          attacker_roll, defender_roll = char2_roll, char1_roll
                      else:
                          # Tie: higher agility wins, or char1 if still tied
                          if char1.agility >= char2.agility:
                              attacker, defender = char1, char2
                              attacker_roll, defender_roll = char1_roll, char2_roll
                          else:
                              attacker, defender = char2, char1
                              attacker_roll, defender_roll = char2_roll, char1_roll

                      return InitiativeResult(
                          attacker=attacker,
                          defender=defender,
                          attacker_roll=attacker_roll,
                          defender_roll=defender_roll,
                          attacker_total=attacker.agility + attacker_roll,
                          defender_total=defender.agility + defender_roll
                      )

          test_approach: |
            tests/unit/domain/services/test_initiative_resolver.py:
            - Test higher initiative wins
            - Test tie-breaker: higher agility wins
            - Test tie-breaker: equal agility, first character wins
            - Use FixedDiceRoller for deterministic rolls

        acceptance_criteria:
          - criterion: "InitiativeResult value object captures attacker and defender"
            verification: "Frozen dataclass with all required fields"

          - criterion: "InitiativeResolver calculates initiative as agility + dice roll"
            verification: "Unit test with FixedDiceRoller validates calculation"

          - criterion: "Higher initiative total determines attacker"
            verification: "char1.agility=25, roll=3 beats char2.agility=13, roll=5"

          - criterion: "Tie-breaker: higher agility wins"
            verification: "Equal totals, higher agility designated attacker"

          - criterion: "Tie-breaker: equal agility, first character wins"
            verification: "char1 wins if all values equal"

        validation_commands:
          - "pytest tests/unit/domain/services/test_initiative_resolver.py -v"
          - "pytest tests/e2e/test_combat_simulation.py::test_character_with_higher_agility_wins_initiative -v"
          - "pytest tests/e2e/test_combat_simulation.py::test_initiative_tie_resolved_by_first_character_rule -v"

        expected_e2e_scenarios_passing:
          - "Scenario 2: Character with higher agility wins initiative"
          - "Scenario 9: Initiative tie resolved by first character rule"

        deliverables:
          - file: "src/domain/model/initiative_result.py"
            description: "InitiativeResult frozen dataclass"
          - file: "src/domain/services/initiative_resolver.py"
            description: "InitiativeResolver with dependency injection"
          - file: "tests/unit/domain/services/test_initiative_resolver.py"
            description: "Unit tests for InitiativeResolver (3-4 tests)"

      # ------------------------------------------------------------------
      # STEP 02-02: Implement AttackResult and AttackResolver
      # ------------------------------------------------------------------
      - step_id: "02-02"
        step_name: "Implement AttackResult and AttackResolver"
        description: |
          Create AttackResult value object and AttackResolver domain service
          to resolve single attacks with damage calculation and HP reduction.

        motivation: |
          AttackResolver is core combat mechanic:
          1. Implements damage formula: attack_power + dice_roll
          2. Validates attacker is alive (business rule enforcement)
          3. Applies damage with HP flooring at 0
          4. Returns AttackResult with complete attack information

        estimated_hours: 0.25  # 15 minutes

        dependencies:
          - step_id: "01-01"
            reason: "Requires Character.receive_damage() method"
          - step_id: "01-02"
            reason: "Requires DiceRoller for attack rolls"

        prerequisites:
          - "Read docs/requirements/user-stories.md (Story 4: Attack Resolution)"
          - "Read docs/architecture/architecture-design.md (AttackResolver interface)"

        inputs:
          - file: "docs/architecture/architecture-design.md"
            relevant_sections: ["Domain Services > AttackResolver", "Appendix A: AttackResult"]
          - file: "docs/requirements/user-stories.md"
            relevant_sections: ["Story 4: Attack Resolution (AC-4.1 through AC-4.5)"]

        implementation_guidance:
          attack_result:
            location: "src/domain/model/attack_result.py"
            pattern: |
              @dataclass(frozen=True)
              class AttackResult:
                  attacker_name: str
                  defender_name: str
                  dice_roll: int          # [1, 6]
                  attack_power: int       # Attacker's attack stat
                  total_damage: int       # attack_power + dice_roll
                  defender_old_hp: int    # HP before damage
                  defender_new_hp: int    # HP after damage (floored at 0)
                  defender_after: Character  # New Character instance with reduced HP

          attack_resolver:
            location: "src/domain/services/attack_resolver.py"
            pattern: |
              @dataclass
              class AttackResolver:
                  dice_roller: DiceRoller

                  def resolve_attack(self, attacker: Character, defender: Character) -> AttackResult:
                      """Resolve single attack.

                      Raises:
                          ValueError: If attacker is dead (HP = 0), with message
                                      "Dead character cannot attack"
                      """
                      if not attacker.is_alive:
                          raise ValueError("Dead character cannot attack")

                      dice_roll = self.dice_roller.roll()
                      total_damage = attacker.attack_power + dice_roll
                      defender_after = defender.receive_damage(total_damage)

                      return AttackResult(
                          attacker_name=attacker.name,
                          defender_name=defender.name,
                          dice_roll=dice_roll,
                          attack_power=attacker.attack_power,
                          total_damage=total_damage,
                          defender_old_hp=defender.hp,
                          defender_new_hp=defender_after.hp,
                          defender_after=defender_after
                      )

          test_approach: |
            tests/unit/domain/services/test_attack_resolver.py:
            - Test damage calculation (attack_power + dice_roll)
            - Test defender HP reduction
            - Test HP flooring at 0 (overkill damage)
            - Test dead attacker raises ValueError with exact message
            - Use FixedDiceRoller for deterministic damage

        acceptance_criteria:
          - criterion: "AttackResult captures complete attack information"
            verification: "All fields populated correctly"

          - criterion: "Damage = attacker.attack_power + dice_roll"
            verification: "attack=5, roll=4 → damage=9"

          - criterion: "Defender HP reduced by damage (via receive_damage)"
            verification: "defender hp=10, damage=9 → new_hp=1"

          - criterion: "HP floors at 0 (never negative)"
            verification: "defender hp=5, damage=10 → new_hp=0"

          - criterion: "Dead attacker (HP=0) raises ValueError with message 'Dead character cannot attack'"
            verification: |
              try:
                  resolver.resolve_attack(dead_char, defender)
                  assert False, "Should raise ValueError"
              except ValueError as e:
                  assert str(e) == "Dead character cannot attack"

          - criterion: "defender_after is new Character instance (immutability)"
            verification: "defender_after is not defender"

        validation_commands:
          - "pytest tests/unit/domain/services/test_attack_resolver.py -v"
          - "pytest tests/e2e/test_combat_simulation.py::test_dead_character_cannot_initiate_attack -v"

        expected_e2e_scenarios_passing:
          - "Scenario 8: Dead character cannot initiate attack"

        deliverables:
          - file: "src/domain/model/attack_result.py"
            description: "AttackResult frozen dataclass"
          - file: "src/domain/services/attack_resolver.py"
            description: "AttackResolver with damage calculation"
          - file: "tests/unit/domain/services/test_attack_resolver.py"
            description: "Unit tests for AttackResolver (4-5 tests)"

      # ------------------------------------------------------------------
      # STEP 02-03: Implement RoundResult and CombatRound
      # ------------------------------------------------------------------
      - step_id: "02-03"
        step_name: "Implement RoundResult and CombatRound"
        description: |
          Create RoundResult value object and CombatRound domain service
          to orchestrate single combat round with ATTACKER ADVANTAGE enforcement.

        motivation: |
          CombatRound implements critical business rule (DR-06):
          1. Attacker attacks first
          2. Defender counter-attacks ONLY if HP > 0 after attacker's strike
          3. If attacker kills defender, round ends immediately (no counter-attack)
          4. This is the "attacker advantage" wow moment

        estimated_hours: 0.25  # 15 minutes

        dependencies:
          - step_id: "01-01"
            reason: "Requires Character immutability"
          - step_id: "02-02"
            reason: "Requires AttackResolver for attack resolution"

        prerequisites:
          - "Read docs/requirements/user-stories.md (Story 5: Combat Round)"
          - "Read docs/architecture/architecture-design.md (CombatRound service)"

        inputs:
          - file: "docs/architecture/architecture-design.md"
            relevant_sections: ["Domain Services > CombatRound", "Appendix A: RoundResult"]
          - file: "docs/requirements/user-stories.md"
            relevant_sections: ["Story 5: Combat Round (AC-5.1, AC-5.2)"]

        implementation_guidance:
          round_result:
            location: "src/domain/model/round_result.py"
            pattern: |
              from typing import Optional

              @dataclass(frozen=True)
              class RoundResult:
                  round_number: int
                  attacker: Character           # State after round
                  defender: Character           # State after round
                  attacker_damage: int          # Damage dealt by attacker
                  defender_damage: int          # Damage dealt by defender (0 if dead)
                  combat_ended: bool            # True if someone died
                  winner: Optional[Character]   # Winner if combat_ended, else None

          combat_round:
            location: "src/domain/services/combat_round.py"
            pattern: |
              @dataclass
              class CombatRound:
                  attack_resolver: AttackResolver

                  def execute_round(
                      self,
                      attacker: Character,
                      defender: Character,
                      round_number: int
                  ) -> RoundResult:
                      """Execute one combat round with attacker advantage.

                      1. Attacker attacks first
                      2. Check if defender alive after attacker's strike
                      3. Defender counter-attacks ONLY if HP > 0
                      4. Return round result with both character states

                      Note: attacker/defender roles are determined once by initiative
                      and persist throughout combat. Roles do NOT swap after each round.
                      The same character (attacker) attacks first in every round.
                      """
                      # Attacker strikes first
                      attacker_attack = self.attack_resolver.resolve_attack(attacker, defender)
                      defender_after_attack = attacker_attack.defender_after

                      # CRITICAL: Check if defender survived
                      if not defender_after_attack.is_alive:
                          # Defender died - no counter-attack (ATTACKER ADVANTAGE)
                          return RoundResult(
                              round_number=round_number,
                              attacker=attacker,
                              defender=defender_after_attack,
                              attacker_damage=attacker_attack.total_damage,
                              defender_damage=0,  # No counter-attack
                              combat_ended=True,
                              winner=attacker
                          )

                      # Defender survived - counter-attack
                      defender_attack = self.attack_resolver.resolve_attack(
                          defender_after_attack,
                          attacker
                      )
                      attacker_after_counter = defender_attack.defender_after

                      # Check if attacker died from counter-attack
                      combat_ended = not attacker_after_counter.is_alive
                      winner = defender_after_attack if combat_ended else None

                      return RoundResult(
                          round_number=round_number,
                          attacker=attacker_after_counter,
                          defender=defender_after_attack,
                          attacker_damage=attacker_attack.total_damage,
                          defender_damage=defender_attack.total_damage,
                          combat_ended=combat_ended,
                          winner=winner
                      )

          test_approach: |
            tests/unit/domain/services/test_combat_round.py:
            - Test both characters survive (both attack)
            - Test attacker kills defender (no counter-attack)
            - Test defender survives and counter-attacks
            - Test defender kills attacker in counter-attack
            - Use FixedDiceRoller for deterministic combat

        acceptance_criteria:
          - criterion: "Attacker attacks first in all cases"
            verification: "attacker_attack resolved before defender_attack"

          - criterion: "Defender counter-attacks ONLY if HP > 0 after attacker's strike"
            verification: "defender.is_alive checked before counter-attack"

          - criterion: "If defender dies, defender_damage = 0 (no counter-attack)"
            verification: "RoundResult.defender_damage = 0 when defender dies"

          - criterion: "combat_ended = True when someone dies"
            verification: "RoundResult.combat_ended set correctly"

          - criterion: "winner is attacker if defender dies, defender if attacker dies"
            verification: "RoundResult.winner matches deceased character"

        validation_commands:
          - "pytest tests/unit/domain/services/test_combat_round.py -v"
          - "pytest tests/e2e/test_combat_simulation.py::test_attacker_kills_defender_no_counter_attack -v"
          - "pytest tests/e2e/test_combat_simulation.py::test_defender_survives_and_counter_attacks -v"

        expected_e2e_scenarios_passing:
          - "Scenario 3: Attacker kills defender - no counter-attack occurs"
          - "Scenario 4: Defender survives and counter-attacks"

        deliverables:
          - file: "src/domain/model/round_result.py"
            description: "RoundResult frozen dataclass"
          - file: "src/domain/services/combat_round.py"
            description: "CombatRound with attacker advantage enforcement"
          - file: "tests/unit/domain/services/test_combat_round.py"
            description: "Unit tests for CombatRound (4-5 tests)"

        wow_moment:
          trigger: "Attacker advantage implementation"
          demonstration: "Show combat where attacker kills defender in first strike - no counter-attack occurs"
          audience_value: "Business rule enforcement in domain layer, no conditional logic leakage to presentation"

# ============================================================================
# PHASE 3: APPLICATION LAYER (~10 minutes)
# ============================================================================

  - phase_number: 3
    phase_name: "Application Layer - Combat Orchestration"
    purpose: "Implement CombatSimulator use case to orchestrate complete combat from initiative to victory"
    estimated_duration: "10 minutes"

    success_criteria:
      - "CombatSimulator orchestrates full combat loop"
      - "Initiative rolled once at start"
      - "Rounds continue until victory condition"
      - "CombatResult contains winner, loser, all rounds"
      - "Scenario 1 PASS (full combat simulation)"
      - "All 9/9 E2E scenarios PASS"

    steps:
      # ------------------------------------------------------------------
      # STEP 03-01: Implement CombatResult and CombatSimulator
      # ------------------------------------------------------------------
      - step_id: "03-01"
        step_name: "Implement CombatResult and CombatSimulator"
        description: |
          Create CombatResult value object and CombatSimulator application service
          to orchestrate complete combat from initiative through victory.

        motivation: |
          CombatSimulator is the main use case:
          1. Orchestrates InitiativeResolver, CombatRound services
          2. Implements game loop (rounds until victory)
          3. Validates all business rules working together
          4. Makes E2E walking skeleton test pass

        estimated_hours: 0.17  # 10 minutes

        dependencies:
          - step_id: "02-01"
            reason: "Requires InitiativeResolver for combat order"
          - step_id: "02-03"
            reason: "Requires CombatRound for round execution"

        prerequisites:
          - "Read docs/requirements/user-stories.md (Story 6: Game Loop, Story 7: Victory)"
          - "Read docs/architecture/architecture-design.md (CombatSimulator interface)"
          - "Read docs/distill/handoff-to-develop.md (Phase 3: Application Layer)"

        inputs:
          - file: "docs/architecture/architecture-design.md"
            relevant_sections: ["Application Service > CombatSimulator", "Appendix A: CombatResult"]
          - file: "docs/requirements/user-stories.md"
            relevant_sections: ["Story 6: Game Loop (AC-6.1)", "Story 7: Victory (AC-7.1)"]

        implementation_guidance:
          combat_result:
            location: "src/domain/model/combat_result.py"
            pattern: |
              from typing import Tuple

              @dataclass(frozen=True)
              class CombatResult:
                  winner: Character
                  loser: Character
                  total_rounds: int
                  rounds: Tuple[RoundResult, ...]  # Immutable sequence

          combat_simulator:
            location: "src/application/combat_simulator.py"
            pattern: |
              @dataclass
              class CombatSimulator:
                  initiative_resolver: InitiativeResolver
                  combat_round: CombatRound

                  def run_combat(self, char1: Character, char2: Character) -> CombatResult:
                      """Run complete combat until one character dies.

                      1. Roll initiative (once at start)
                      2. Execute rounds until victory
                      3. Return CombatResult with complete combat history

                      Note: Attacker/defender roles persist from initiative through entire combat.
                      Roles do NOT swap after each round - same character attacks first every round.
                      """
                      # Roll initiative ONCE at start (DR-04)
                      initiative = self.initiative_resolver.roll_initiative(char1, char2)
                      attacker = initiative.attacker
                      defender = initiative.defender

                      # Combat loop
                      rounds = []
                      round_number = 1

                      while attacker.is_alive and defender.is_alive:
                          round_result = self.combat_round.execute_round(
                              attacker,
                              defender,
                              round_number
                          )
                          rounds.append(round_result)

                          # Update character states for next round
                          # Roles persist - same attacker/defender throughout combat
                          attacker = round_result.attacker
                          defender = round_result.defender

                          # Check victory condition (DR-07)
                          # combat_ended tells simulator whether to continue round loop
                          if round_result.combat_ended:
                              break

                          round_number += 1

                      # Determine winner and loser
                      if attacker.is_alive:
                          winner, loser = attacker, defender
                      else:
                          winner, loser = defender, attacker

                      return CombatResult(
                          winner=winner,
                          loser=loser,
                          total_rounds=len(rounds),
                          rounds=tuple(rounds)  # Immutable tuple
                      )

          test_approach: |
            tests/unit/application/test_combat_simulator.py:
            - Test combat completes when character dies
            - Test initiative rolled once (not per round)
            - Test all rounds recorded in CombatResult
            - Test winner determination
            - Use FixedDiceRoller with sequence for full combat

        acceptance_criteria:
          - criterion: "Initiative rolled once at combat start"
            verification: "InitiativeResolver.roll_initiative called once per combat"

          - criterion: "Round loop continues until someone dies"
            verification: "while attacker.is_alive and defender.is_alive"

          - criterion: "Combat ends immediately when someone reaches 0 HP"
            verification: "round_result.combat_ended breaks loop"

          - criterion: "CombatResult contains winner, loser, total_rounds, all rounds"
            verification: "All fields populated correctly"

          - criterion: "rounds is immutable tuple (not list)"
            verification: "type(combat_result.rounds) == tuple"

        validation_commands:
          - "pytest tests/unit/application/test_combat_simulator.py -v"
          - "pytest tests/e2e/test_combat_simulation.py::test_full_combat_with_attacker_advantage_enforcement -v"
          - "pytest tests/e2e/ -v  # All 9 scenarios should PASS"

        expected_e2e_scenarios_passing:
          - "Scenario 1: Full combat with attacker advantage enforcement"
          - "ALL 9 E2E scenarios should PASS after this step"

        deliverables:
          - file: "src/domain/model/combat_result.py"
            description: "CombatResult frozen dataclass"
          - file: "src/application/combat_simulator.py"
            description: "CombatSimulator orchestrating full combat"
          - file: "tests/unit/application/test_combat_simulator.py"
            description: "Unit tests for CombatSimulator (3-4 tests)"

        wow_moment:
          trigger: "E2E walking skeleton test turns GREEN"
          demonstration: "Run pytest tests/e2e/ -v and show all 9 scenarios PASSING"
          audience_value: "Outside-In TDD completes - E2E test driven entire implementation"

