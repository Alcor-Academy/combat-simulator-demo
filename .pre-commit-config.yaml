repos:
  # =============================================================================
  # FORMATTING (runs first - auto-fixes code style)
  # =============================================================================
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff-format (Black replacement)
        entry: pipenv run ruff format
        language: system
        types: [python]

  # =============================================================================
  # LINTING (runs on formatted code)
  # =============================================================================
  - repo: local
    hooks:
      - id: ruff-lint
        name: ruff-lint (Flake8 + Pylint + isort replacement)
        entry: pipenv run ruff check --fix
        language: system
        types: [python]

  # =============================================================================
  # TYPE CHECKING (only on modules/, not tests)
  # =============================================================================
  - repo: local
    hooks:
      - id: mypy
        name: mypy (type checking)
        entry: pipenv run mypy
        language: system
        types: [python]
        files: ^modules/
        exclude: ^tests/

  # =============================================================================
  # SECURITY SCANNING
  # =============================================================================
  - repo: local
    hooks:
      - id: bandit
        name: bandit (security scanner)
        entry: pipenv run bandit -r modules/ -x tests
        language: system
        types: [python]
        pass_filenames: false

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        name: detect-secrets (credentials scanner)
        exclude: \.secrets\.baseline$

  # =============================================================================
  # GENERAL HYGIENE
  # =============================================================================
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-added-large-files
        args: ["--maxkb=1000"]
      - id: check-merge-conflict
      - id: debug-statements

  # =============================================================================
  # COMMIT MESSAGE VALIDATION
  # =============================================================================
  - repo: https://github.com/commitizen-tools/commitizen
    rev: v4.2.2
    hooks:
      - id: commitizen
        stages: [commit-msg]

  # ═══════════════════════════════════════════════════════════════════════════
  # nWave TDD Hooks - Auto-installed by /nw:develop
  # Version: 1.2.18
  # ═══════════════════════════════════════════════════════════════════════════
  - repo: local
    hooks:
      - id: nwave-step-structure-validation
        name: nWave Step Structure Validation
        entry: python scripts/hooks/nwave-step-structure-validator.py
        language: python
        stages: [pre-commit]
        files: (^|/)steps/\d+-\d+\.json$
        description: Validates step files have phase_execution_log structure

      - id: nwave-tdd-phase-validation
        name: nWave TDD Phase Validation
        entry: python scripts/hooks/nwave-tdd-validator.py
        language: python
        stages: [pre-commit]
        always_run: true
        pass_filenames: false
        description: Validates TDD phase completion before allowing commits

      - id: nwave-bypass-detector
        name: nWave Bypass Detector
        entry: python scripts/hooks/nwave-bypass-detector.py
        language: python
        stages: [post-commit]
        always_run: true
        pass_filenames: false
        description: Logs any bypass attempts for audit purposes

  # ═══════════════════════════════════════════════════════════════════════════
  # nWave TDD Hooks - Auto-installed by /nw:develop
  # Version: 1.2.22
  # ═══════════════════════════════════════════════════════════════════════════
  - repo: local
    hooks:
      - id: nwave-step-structure-validation
        name: nWave Step Structure Validation
        entry: python scripts/hooks/nwave-step-structure-validator.py
        language: python
        stages: [pre-commit]
        files: (^|/)steps/\d+-\d+\.json$
        description: Validates step files have phase_execution_log structure

      - id: nwave-tdd-phase-validation
        name: nWave TDD Phase Validation
        entry: python scripts/hooks/nwave-tdd-validator.py
        language: python
        stages: [pre-commit]
        always_run: true
        pass_filenames: false
        description: Validates TDD phase completion before allowing commits

      - id: nwave-bypass-detector
        name: nWave Bypass Detector
        entry: python scripts/hooks/nwave-bypass-detector.py
        language: python
        stages: [post-commit]
        always_run: true
        pass_filenames: false
        description: Logs any bypass attempts for audit purposes
